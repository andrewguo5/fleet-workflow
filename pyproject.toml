[project]
name = "fleet-workflow"
version = "0.1.0"
description = "A portable workflow for managing a fleet of parallel coding agents, each in its own git worktree, coordinated by a Quartermaster."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Guo", email = "andrew@gorialto.com" }]
keywords = ["agents", "worktree", "git", "parallel", "claude", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/andrewguo/fleet-workflow"
Repository = "https://github.com/andrewguo/fleet-workflow"

[project.scripts]
fleet = "fleet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]
